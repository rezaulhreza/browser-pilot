name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bridge:
    name: Bridge tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: JavaScript parses
        run: |
          node --check extension/worker.js
          node --check extension/options.js
      - name: Manifest is valid and every file it names exists
        run: |
          node -e '
            const fs = require("fs")
            const manifest = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"))
            const files = [
              manifest.background.service_worker,
              manifest.options_ui.page,
              ...Object.values(manifest.icons),
              ...Object.values(manifest.action.default_icon)
            ]
            for (const file of files) {
              if (!fs.existsSync("extension/" + file)) {
                throw new Error("manifest names a missing file: " + file)
              }
            }
            if (manifest.manifest_version !== 3) throw new Error("expected Manifest V3")
          '
      - name: Shell scripts parse
        run: |
          sh -n scripts/install.sh
          sh -n scripts/uninstall.sh
